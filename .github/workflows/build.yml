name: Build & Release AroniumPOS Display Client
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AroniumPOS-Display-Client-Setup-*.exe
            dist/AroniumPOS-Display-Client-Portable-*.exe
          draft: false
          prerelease: false
          body: |
            ## AroniumPOS Display Client ${{ github.ref_name }}

            ### ⬇️ Download
            | File | Description |
            |------|-------------|
            | `AroniumPOS-Display-Client-Setup-${{ github.ref_name }}.exe` | ✅ Recommended — full installer |
            | `AroniumPOS-Display-Client-Portable-${{ github.ref_name }}.exe` | Portable, no install |

            ### Install
            1. Run the Setup `.exe`
            2. First launch → setup wizard (runs **once only**)
            3. Click **"Install bundled driver"** → COM20↔COM21 created automatically
            4. In Aronium: Settings → Devices → Customer Display → **COM20** → Enable ✓
            5. Done — all future launches go directly to the display

            ### Phone / Tablet
            Open Chrome or Safari → `http://YOUR-PC-IP:3000`

            ### Languages
            Switch between 🇬🇧 English / 🇫🇷 Français / 🇸🇦 العربية from the top-right buttons

            ### Currency
            Auto-detected from your Windows locale (MAD, USD, EUR, GBP…)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
