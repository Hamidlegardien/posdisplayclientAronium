name: Build & Release AroniumPOS Display Client
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AroniumPOS-Display-Client-Setup-*.exe
          draft: false
          prerelease: false
          body: |
            ## AroniumPOS Display Client ${{ github.ref_name }}
            ### ⬇️ Download
            Click `AroniumPOS-Display-Client-Setup-*.exe` below.
            ### Install
            1. Run the `.exe` — installs like any Windows app
            2. First launch only → setup wizard (select COM20/COM21, install driver)
            3. In Aronium: Settings → Devices → Customer Display → **COM20** → Enable ✓
            4. Done — orders show in real time. Setup never appears again.
            ### Phone/Tablet
            Open Chrome → `http://YOUR-PC-IP:3000`
            ### Currency
            Automatically detected from your Windows locale settings.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
